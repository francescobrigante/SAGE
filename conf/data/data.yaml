# Data & Demo configuration (split from original JSON)
train_dataset:
  class: ar_spectra.dataset.OnTheFlySTFTDataset
  kwargs:
    audio_dir: /home/cerovaz/repos/data/jamendo_full/train
    target_frames: 128
    sample_rate: 44100
    n_fft: 2048
    hop_length: 512
    win_length: 2048
    center: true
    normalized: false
    extensions: [".mp3"]
    stereo: true
    cac: false
    skip_broken_files: true
    skip_criteria: ["sample_rate"]

train_dataloader:
  batch_size: 8
  num_workers: 8
  prefetch_factor: 8
  pin_memory: false   # can be 'auto' as string if desired
  persistent_workers: false
  shuffle: true
  pin_memory_device: cuda

eval_dataset:
  class: ar_spectra.dataset.OnTheFlySTFTDataset
  kwargs:
    audio_dir: /home/cerovaz/repos/data/jamendo_full/eval
    target_frames: 128
    sample_rate: 44100
    n_fft: 2048
    hop_length: 512
    win_length: 2048
    center: true
    normalized: false
    extensions: [".mp3"]
    stereo: true
    cac: false
    skip_broken_files: true
    skip_criteria: ["sample_rate"]

eval_dataloader:
  batch_size: 8
  num_workers: 8
  prefetch_factor: 8
  pin_memory: false
  persistent_workers: false
  shuffle: false
  pin_memory_device: cuda

demo:
  every_n_epochs: 1
  max_demos: 7
  target_seconds: 1
  istft_params:
    sample_rate: 44100
    fft_size: 2048
    hop_length: 512
    win_length: 2048
    target_frames: 128
    center: true
    normalized: false
  save_basename: recon_val
