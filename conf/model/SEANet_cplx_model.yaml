# Model configuration (encoder/decoder/bottleneck) 
model:
  autoencoder:
    return_latent: false
  encoder:
    class: ar_spectra.models.autoencoders.SeaNET_AE.SEANetEncoder2d
    kwargs:
      input_size: auto           # will be patched at runtime
      dimension: 64
      n_filters: 16
      n_residual_layers: 1
      ratios: [[4,2],[1,2],[4,2]]
      activation: CELU
      norm: time_group_norm
      norm_params: { num_groups: 1 }
      causal: false
      latent_fbins: 64
      dilation_base: 2
      seq_model: none
      is_complex: true
  decoder:
    class: ar_spectra.models.autoencoders.SeaNET_AE.SEANetDecoder2d
    kwargs:
      channels: auto             # will be patched at runtime
      input_size: 64
      n_filters: 16
      n_residual_layers: 1
      ratios: [[4,2],[1,2],[4,2]]
      activation: CELU
      norm: time_group_norm
      norm_params: { num_groups: 1 }
      causal: false
      latent_fbins: 64
      dilation_base: 2
      seq_model: none
      is_complex: true
  bottleneck:
    class: ar_spectra.models.bottlenecks.VAEBottleneck
    skip_bottleneck: true
