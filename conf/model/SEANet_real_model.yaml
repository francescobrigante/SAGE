# Model configuration (encoder/decoder/bottleneck) from original JSON
model:
  autoencoder:
    return_latent: false
  encoder:
    class: ar_spectra.models.autoencoders.SeaNET_AE.SEANetEncoder2d
    kwargs:
      input_size: auto           # will be patched at runtime
      dimension: 128
      n_filters: 8
      n_residual_layers: 1
      ratios: [[4,2],[1,2],[4,2]]
      activation: ELU
      norm: weight_norm
      norm_params: { num_groups: 1 }
      causal: false
      latent_fbins: 64
      dilation_base: 2
      seq_model: none

  decoder:
    class: ar_spectra.models.autoencoders.SeaNET_AE.SEANetDecoder2d
    kwargs:
      channels: auto             # will be patched at runtime
      input_size: 128
      n_filters: 8
      n_residual_layers: 1
      ratios: [[4,2],[1,2],[4,2]]
      activation: ELU
      norm: weight_norm
      norm_params: { num_groups: 1 }
      causal: false
      latent_fbins: 64
      dilation_base: 2
      seq_model: none
  bottleneck:
    class: ar_spectra.models.bottlenecks.VAEBottleneck
    skip_bottleneck: true
