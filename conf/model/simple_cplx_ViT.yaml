# Model configuration (encoder/decoder/bottleneck) 
model:
  autoencoder:
    return_latent: false
    # Spectrogram normalization applied at encoder input and inverted at decoder output
    pre_transform:
      type: none     # none | log_mag | power_norm
      apply_target: true   # set apply_target: true to apply the normalization also to the target spectrograms
      apply_inverse: true # set apply_inverse: false to apply the normalization only before the encoder
      config:
        eps: 1.0e-8
        alpha: 0.65
        beta: 0.35

  encoder:
    class: ar_spectra.models.autoencoders.simple_cplx_ViT.ViTEncoder
    kwargs:
      input_size: "auto"           # will be patched at runtime
      dim: 512
      image_size: [512, 64]
      patch_size: [64, 8]
      mlp_dim: 256
      depth: 2
      heads: 8
      dropout: 0.0
      is_complex: true
      bias: false

  decoder:
    class: ar_spectra.models.autoencoders.simple_cplx_ViT.ViTDecoder
    kwargs:
      channels: "auto"             # will be patched at runtime
      input_size: 512
      image_size: [512, 64]
      patch_size: [64, 8]
      mlp_dim: 256
      depth: 2
      heads: 8
      dropout: 0.0
      is_complex: true
      bias: false

  bottleneck:
    class: ar_spectra.models.bottlenecks.VAEBottleneck
    skip_bottleneck: true
