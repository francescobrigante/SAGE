# Model configuration (encoder/decoder/bottleneck) 
model:
  autoencoder:
    return_latent: false
    # Spectrogram normalization applied at encoder input and inverted at decoder output
    pre_transform:
      type: none     # none | log_mag | power_norm
      apply_target: true   # set apply_target: true to apply the normalization also to the target spectrograms
      apply_inverse: true # set apply_inverse: false to apply the normalization only before the encoder
      config:
        eps: 1.0e-8
        alpha: 0.65
        beta: 0.35

  encoder:
    class: ar_spectra.models.autoencoders.simple_transformer_AE.SimpleTransformerEncoder
    kwargs:
      input_size: "auto"           # will be patched at runtime
      dim: 4
      depth: 4
      n_heads: 8
      dropout_rate: 0.05
      patch_size: [16, 16]
      image_size: [1025, 128]      # original spectrogram shape INCLUDING Nyquist bin (F = n_fft//2 + 1)
      inter_dim: 64
      use_pos_enc: true
      downsample_ratio: 2

  decoder:
    class: ar_spectra.models.autoencoders.simple_transformer_AE.SimpleTransformerDecoder
    kwargs:
      channels: "auto"             # will be patched at runtime
      dim: 4
      depth: 4
      n_heads: 8
      dropout_rate: 0.05
      patch_size: [16, 16]
      inter_dim: 64
      image_size: [1025, 128]      # expected output shape INCLUDING Nyquist bin (F = n_fft//2 + 1)
      use_pos_enc: true
      downsample_ratio: 2


  bottleneck:
    class: ar_spectra.models.bottlenecks.VAEBottleneck
    skip_bottleneck: true
