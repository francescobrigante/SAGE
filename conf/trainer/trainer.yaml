# Trainer + optimization + logging + losses + seed/device
seed: 94
device: cuda

optimizer:
  type: RAdam
  config:
    lr: 4e-3
    weight_decay: 1e-5
    decoupled_weight_decay: true

scheduler:
  type: InverseLR
  config:
    inv_gamma: 30000
    power: 0.5
    warmup: 0

trainer:
  precision: 32-true
  epochs: 100
  amp: false
  log_interval: 1
  deterministic: false
  strict_deterministic: false
  ckpt_dir: checkpoints/seanet_stft
  profile: false
  check_val_every_n_epoch: 1
  save_every_n_epochs: 5
  num_sanity_val_steps: 0
  log_model_structure: true
  warmup_steps: 0
  warmup_mode: adv
  encoder_freeze_on_warmup: false
  profiler_dir: lightning_profiler
  val_check_interval: null
  strategy: auto
  num_gpus: 1

wandb:
  project: ICML_2026
  name: SEANet_STFT_losses
  use_wandb: true

# Spectrogram normalization applied at encoder input and inverted at decoder output
pre_transform:
  type: none          # none | log_mag | power_norm
  config:
    eps: 1.0e-8
    alpha: 0.65
    beta: 0.35

eval_loss_config:
  sisdr:
    zero_mean: true
    reduction: mean
  stft:
    sample_rate: 44100
    fft_size: 2048
    hop_size: 512
    win_length: 2048
  mel:
    fft_size: 2048
    hop_size: 512
    win_length: 2048
    n_mels: 128

loss_config:
  spectral:
    stft_mse:
      config:
        reduction: mean

    mrstft:
      config:
        reduction: mean
        factor_sc: 0.0
        factor_mag: 0.5
        linear_mag: true
        factor_linear_mag: 1.0

    cosine_phase_loss:
      config:
        reduction: mean
        energy_weighted: false

    weights: { stft_mse: 1.0, mrstft: 4.0, cosine_phase_loss: 2.0 }

# Legacy fallback controls
use_json: false
json_path: null
