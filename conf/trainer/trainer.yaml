# Trainer + optimization + logging + losses + seed/device
seed: 94
device: cuda

optimizer:
  type: RAdam
  config:
    lr: 1e-3
    weight_decay: 1e-5
    decoupled_weight_decay: true


scheduler:
  type: InverseLR
  config:
    inv_gamma: 30000
    power: 0.5
    warmup: 0

trainer:
  precision: 32-true
  epochs: 100
  amp: false
  log_interval: 1
  deterministic: false
  strict_deterministic: false
  ckpt_dir: checkpoints/seanet_stft
  profile: false
  check_val_every_n_epoch: 1
  save_every_n_epochs: 5
  num_sanity_val_steps: 0
  log_model_structure: true
  warmup_steps: 0
  warmup_mode: adv
  encoder_freeze_on_warmup: false
  profiler_dir: lightning_profiler
  val_check_interval: null
  strategy: auto
  num_gpus: 1
  terminate_on_nan: true
  detect_anomaly: true
  gradient_clip_val: 5.0
  gradient_clip_algorithm: norm

  NaNDetector:
    enable: false
    check_inputs: true
    check_outputs: true
    check_gradients: true
    check_parameters: true
    every_n_steps: 1

wandb:
  project: ICML_2026
  name: ViT_trial_error
  use_wandb: true

eval_loss_config:
  sisdr:
    zero_mean: true
    reduction: mean
  stft:
    sample_rate: 44100
    fft_size: 2048
    hop_size: 512
    win_length: 2048
  mel:
    fft_size: 2048
    hop_size: 512
    win_length: 2048
    n_mels: 128

loss_config:
  spectral:
    apply_pre_transform_to_wave_losses: false
    stft_mse:
      config:
        reduction: mean

    weights: {stft_mse: 1.0}


# Legacy fallback controls
use_json: false
json_path: null
