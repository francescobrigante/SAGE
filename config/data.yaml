# Data & Demo configuration - Hydra instantiate API
# Use _target_ for automatic instantiation via hydra.utils.instantiate

train_dataset:
  _target_: dataloader.OnTheFlySTFTDataset
  audio_dir: ${config:DATA_PATH}
  target_frames: 128
  sample_rate: ${config:DEFAULT_SAMPLE_RATE}
  n_fft: 2048
  hop_length: 512
  win_length: 2048
  center: true
  normalized: false
  extensions: [".mp3"]
  stereo: true
  cac: true
  skip_failed_samples: true
  skip_mismatched_sr: false
  skip_mismatched_channels: false
  custom_metadata_module: src.ar_spectra.utils.metadata.fma
  custom_metadata_kwargs:
    split: training
    subset: small
    metadata_csv: ${config:FMA_METADATA}

train_dataloader:
  batch_size: ${config:DEFAULT_BATCH_SIZE}
  num_workers: ${config:DEFAULT_NUM_WORKERS}
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  shuffle: true
  drop_last: true

eval_dataset:
  _target_: dataloader.OnTheFlySTFTDataset
  audio_dir: ${config:DATA_PATH}
  target_frames: 128
  sample_rate: ${config:DEFAULT_SAMPLE_RATE}
  n_fft: 2048
  hop_length: 512
  win_length: 2048
  center: true
  normalized: false
  extensions: [".mp3"]
  stereo: true
  cac: true
  skip_mismatched_sr: false
  skip_mismatched_channels: false
  skip_failed_samples: true
  custom_metadata_module: src.ar_spectra.utils.metadata.fma
  custom_metadata_kwargs:
    split: validation
    subset: small
    metadata_csv: ${config:FMA_METADATA}

eval_dataloader:
  batch_size: ${config:DEFAULT_BATCH_SIZE}
  num_workers: ${config:DEFAULT_NUM_WORKERS}
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  shuffle: false
  drop_last: false

# Channel configuration - MUST match dataset settings manually
# stereo=true, cac=false -> audio_channels=2, model_channels=2
# stereo=true, cac=true  -> audio_channels=2, model_channels=4
# stereo=false, cac=false -> audio_channels=1, model_channels=1
# stereo=false, cac=true  -> audio_channels=1, model_channels=2
audio_channels: ${config:DEFAULT_AUDIO_CHANNELS}
model_channels: 4

demo:
  every_n_epochs: 1
  max_demos: 7
  target_seconds: 2
  istft_params:
    sample_rate: ${config:DEFAULT_SAMPLE_RATE}
    fft_size: 2048
    hop_length: 512
    win_length: 2048
    target_frames: 128
    center: true
    normalized: false
    cac: true
  save_basename: recon_val
