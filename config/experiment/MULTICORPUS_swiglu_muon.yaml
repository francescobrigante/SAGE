# @package _global_
# ============================================================
# MULTICORPUS_baseline — LARGE2 recipe trained on the multi-corpus dataset.
#
#   Self-contained experiment: bakes in the FULL LARGE2 recipe (CLAP distill +
#   WavTokenizer disc + mrmel=0.5 + EMA) that LARGE2 passed as a long list of CLI
#   `++` overrides. Here those overrides live in ONE file so the SLURM stays clean.
#
#   Derived VERBATIM from LARGE2 (O8 recipe + mrmel 0.3→0.5), with ONLY the three
#   step-based knobs rescaled for the new regime (global batch 16→128, dataset
#   84k→122k/epoch), so the run reproduces LARGE2's optimization trajectory:
#       * scheduler.inv_gamma   200000 → 36000   (÷5.5 ≈ total-step ratio 95.6k/527k)
#       * detach_warmup_steps: remains 25000     (generator steps matter, not epochs)
#   Everything else (lr=1e-3, ema=0.9998, kl=1e-4, mrmel=0.5, disc, precision 32)
#   is the LARGE2 recipe untouched.
#
#   Hardware/run knobs (num_gpus, num_nodes, batch_size, epochs) are NOT here —
#   they are set in the SLURM (MULTICORPUS_baseline.slurm) since they are run
#   configuration, not recipe. Select the dataset with `data=multicorpus`.
#
#   Usage:  +experiment=MULTICORPUS_baseline  data=multicorpus
# ============================================================
defaults:
  - override /models: swin_real_swiglu_xsa

trainer:
  wandb:
    name: MULTICORPUS_swiglu_muon
  trainer:
    ckpt_dir: checkpoints/MULTICORPUS_swiglu_muon
    check_val_every_n_epoch: 1
    save_every_n_epochs: 5            # 100 epochs → 20 ckpts (LARGE2 used 10)
    strategy: ddp_find_unused_parameters_true
    precision: "32"
    compile: false
    ema_decay: 0.9998

  # ── Generator optimizer (Muon) ──────────────────
  optimizer:
    _target_: ar_spectra.training.optimizers.MuonAdamW
    lr: 1e-3
    muon_lr: 1e-2
    adamw_lr: 1e-3
    weight_decay: 1e-4
    weight_decay_exclude_1d: true
    betas: [0.9, 0.98]
    eps: 1e-8
    muon_momentum: 0.95
    muon_nesterov: true
    ns_steps: 5
    matrix_lr_scale: true
    log_param_coverage: true
  scheduler:
    inv_gamma: 36000                 # ← from 200000. The run is only ~95.6k steps
                                     #   (global batch 128); 200000 would leave LR
                                     #   ~flat at 0.82×peak. 36000 reproduces LARGE2's
                                     #   decay to ~0.52×peak by the end of training.

  # ── Aux optimizer for the distill projector (Linear 64→512), LARGE2 = O4b ──
  aux_optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-5                          # slow projector: still learning at the gate
    betas: [0.9, 0.98]
    weight_decay: 1e-4
  aux_scheduler:
    _target_: torch.optim.lr_scheduler.ConstantLR
    factor: 1.0
    total_iters: 1
    interval: step

  # ── Discriminator optimizer (WavTokenizer disc), LARGE2 verbatim ──────────
  disc_optimizer:
    _target_: torch.optim.AdamW
    lr: 2e-4
    betas: [0.8, 0.99]
    weight_decay: 1e-3

  loss_config:
    # M5 reconstruction baseline.
    spectral:
      weights:
        stft_mse: 1.0
        mrstft: 0.0
    bottleneck:
      weights:
        kl: 1.0e-4
    # mrmel 0.5 — the LARGE2 signature change (vs LARGE1's silent 0.3).
    mrmel:
      weights:
        mrmel: 0.5
    # CLAP clip-level cosine distillation (O4b family, CLAP teacher = 512-dim).
    semantic_distill:
      teacher_type: clap
      weights:
        distill: 1.0
      config:
        proj_dim: 512                # CLAP hidden dim (was 768 for MERT in O4b)
        latent_dim: 64               # D = C·F_lat (real baseline: 16·4 = 64)
      detach_warmup_steps: 25000     # Kept at 25000. PL increments global_step 3x per batch (3 optimizers).
                                     # We need physical generator steps for SISDR to mature.
    # WavTokenizer discriminator (RPGAN), LARGE2 verbatim.
    discriminator:
      type: wavtokenizer
      config:
        loss_type: rpgan
        periods: [2, 3, 5, 7, 11]
        fft_sizes: [2048, 1024, 512]
        preprocess: true
      weights:
        adversarial: 0.1
        feature_matching: 0.2
