# @package _global_
# ============================================================
# O2_real_flow_dit — Fase 6 (LATENT_ALIGNMENT_PLAN.md / SAME §3.3.1)
#   M5 real baseline (swin_real_baseline, stft_MSE recon) + flow-matching DiT
#   alignment sul latente. I params del DiT si allenano via opt_aux (aux_optimizer).
#   Config di esperimento STANDALONE — non modifica trainer.yaml.
#   Uso: python train.py +experiment=O2_real_flow_dit
# ============================================================
defaults:
  - override /models: swin_real_baseline

trainer:
  wandb:
    name: O2_real_flow_dit
  trainer:
    ckpt_dir: checkpoints/O2_real_flow_dit
  # 3° optimizer per i params learnable del DiT (opt_gen vede solo l'autoencoder, §0.4)
  aux_optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-3       # mirror main gen optimizer (SAME §4.2: single lr for all)
    betas: [0.9, 0.95]
    weight_decay: 1e-4
  loss_config:
    # Ricostruzione baseline M5 (solo stft_MSE): tiene stft_mse, azzera il resto
    spectral:
      weights:
        stft_mse: 1.0
        mrstft: 0.0

    bottleneck:
      weights:
        kl: 1.0e-5
    # Fase 6 — flow-matching DiT (famiglia generativa; FAD/LDM, non MAEB)
    latent_flow:
      weights:
        flow: 0.1
      config:
        latent_dim: 16     # = latent_channels di swin_real_baseline
        hidden: 768        # larghezza transformer DiT
        depth: 4           # layer DiT (SAME: 4)
        fourier_dim: 256   # dim embedding di Fourier del timestep
      detach_warmup_steps: 10000   # encoder-grad gated fino a questo step (anti prior-escape)
