# @package _global_
# ============================================================
# O4b_real_distill_mert — identico a O4 ma aux_optimizer.lr=1e-5 (vs 1e-3 in O4)
#
#   Motivazione: in O4 il projector Linear(64,768) satura in ~500 step (lr=1e-3
#   troppo alto), rendendo il gradiente verso l'encoder trascurabile post-warmup.
#   Con lr=1e-5 il projector è ancora in apprendimento a step 25k → encoder riceve
#   un segnale semantico significativo per tutta la fase joint.
#
#     L = (1 − cos(Linear(z_avg), t_avg)).mean()   ∈ [0, 2]
#
#   Confronto diretto: O4 (lr=1e-3) vs O4b (lr=1e-5), tutto il resto invariato.
#   Uso: +experiment=O4b_real_distill_mert
# ============================================================
defaults:
  - override /models: swin_real_baseline

trainer:
  wandb:
    name: O4b_real_distill_mert
  trainer:
    ckpt_dir: checkpoints/O4b_real_distill_mert
  aux_optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-5                   # ← chiave: 100× più basso di O4 (1e-3)
    betas: [0.9, 0.98]
    weight_decay: 1e-4
  aux_scheduler:
    _target_: torch.optim.lr_scheduler.ConstantLR
    factor: 1.0
    total_iters: 1
    interval: step
  loss_config:
    spectral:
      weights:
        stft_mse: 1.0
        mrstft: 0.0
    bottleneck:
      weights:
        kl: 1.0e-5
    semantic_distill:
      weights:
        distill: 1.0
      config:
        proj_dim: 768
        latent_dim: 64
      detach_warmup_steps: 25000
