# Model configuration - Hydra instantiate API (Complex SEANet, Spectral Bottleneck)
# Use _target_ for automatic instantiation via hydra.utils.instantiate
#
# REQUIRED data overrides (add to every train.py call for this model):
#   data.train_dataset.cac=false data.eval_dataset.cac=false
#   data.model_channels=2 data.demo.istft_params.cac=false
# Reason: complex encoder expects complex tensors (not real CAC-split tensors)
#

model:
  # ── single source of truth ──────────────────────────────────────────
  latent_channels: 64      # decoder input dim = latent space size
  parameters_to_predict: 3 # must be 3 for spectral (improper) mode
  # ────────────────────────────────────────────────────────────────────

  autoencoder:
    return_latent: false
    pre_transform:
      type: power_norm     # none | log_mag | power_norm
      apply_target: true
      apply_inverse: true
      config:
        eps: 1.0e-8
        alpha: 0.65
        beta: 0.35

  encoder:
    _target_: ar_spectra.models.implementations.SeaNET_AE.SEANetEncoder2d
    # input_size MUST match data.model_channels
    input_size: 2
    dimension: ${mul:${models.model.parameters_to_predict},${models.model.latent_channels}}
    n_filters: 8
    n_residual_layers: 1
    ratios: [[4,2],[1,2],[4,2]]
    activation: CReLU
    activation_params: {}
    norm: weight_norm
    norm_params: {}
    causal: false
    latent_fbins: 64
    dilation_base: 2
    seq_model: none
    is_complex: true

  decoder:
    _target_: ar_spectra.models.implementations.SeaNET_AE.SEANetDecoder2d
    # channels MUST match data.model_channels
    channels: 2
    input_size: ${models.model.latent_channels}
    n_filters: 8
    n_residual_layers: 1
    ratios: [[4,2],[1,2],[4,2]]
    activation: CReLU
    activation_params: {}
    norm: weight_norm
    norm_params: {}
    causal: false
    latent_fbins: 64
    dilation_base: 2
    seq_model: none
    is_complex: true

  bottleneck:
    _target_: c_vae.bottleneck.ComplexVAEBottleneck
    proper: false
    apply_cholesky_constraints: false
    apply_spectral_parameterization: true
