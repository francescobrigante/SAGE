# Model configuration — Hierarchical ViT Complex VAE, 4-stage
#
# Same hierarchical structure as Swin V2 (PatchEmbed + 4 stages + PatchMerging),
# but blocks use GLOBAL attention with 2-D RoPE instead of W-MSA/SW-MSA with
# Log-CPB. Pre-norm ViT block. Rectangular stem (16×4) for the asymmetric
# spectrogram aspect ratio.
#
# Compression check (1.5s stereo 44.1kHz, target_frames=128, hop=512):
#   waveform_samples ≈ 131120   latent_scalars = 128 × 32 × 2 = 8192   → ×16 ✓
#   patch=(16,4) → grid (64,32) → (32,16) → (16,8) → (8,4) → N=32
#
# Required data overrides (CLI or experiment YAML):
#   data.train_dataset.cac=false   data.eval_dataset.cac=false
#   data.demo.istft_params.cac=false   data.model_channels=2

model:
  # ── latent space ────────────────────────────────────────────────────────────
  latent_channels: 128          # ×16 complex: C_lat × N × 2 = 128 × 32 × 2 = 8192 scalars
  parameters_to_predict: 3      # ComplexVAEBottleneck improper: mu + sigma + c

  # ── autoencoder wrapper ──────────────────────────────────────────────────────
  autoencoder:
    return_latent: false
    pre_transform:
      type: power_norm
      apply_target: true
      apply_inverse: true
      config:
        eps: 1.0e-8
        alpha: 0.65
        beta: 0.35

  # ── bottleneck ───────────────────────────────────────────────────────────────
  bottleneck:
    _target_: c_vae.bottleneck.ComplexVAEBottleneck
    apply_cholesky_constraints: false
    apply_spectral_parameterization: false
    proper: false

  # ── shared hier_vit hyperparameters ─────────────────────────────────────────
  hier_vit:
    embed_dim: 64                       # head_dim=16 at all stages with num_heads=[4,8,16,32]
    patch_size: [16, 4]                 # rectangular stem: freq×time (1024,128) → grid (64,32)
    mlp_ratio: 4.0
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.1
    complex_activation: ComplexGELU1d   # phase-equivariant gate on |x|
    abs_pos_embed: false                # RoPE already provides position info
    mim_mask_ratio: 0.0                 # SimMIM-style patch dropout at training
    theta_y: 1000.0                     # RoPE base for freq axis (finer local periodicity)
    theta_x: 10000.0                    # RoPE base for time axis

  # ── encoder ─────────────────────────────────────────────────────────────────
  encoder:
    _target_: c_vae.hier_vit.encoder.HierViTEncoder
    in_channels: 2                    # stereo complex STFT (complex_L, complex_R)
    is_complex: true
    embed_dim: ${models.model.hier_vit.embed_dim}
    depths: [2, 2, 6, 2]             # more depth at stage 3 (16×8 grid, most semantic)
    num_heads: [4, 8, 16, 32]        # head_dim=16 constant: 64/4, 128/8, 256/16, 512/32
    patch_size: ${models.model.hier_vit.patch_size}
    dimension: ${mul:${models.model.parameters_to_predict},${models.model.latent_channels}}
    mlp_ratio: ${models.model.hier_vit.mlp_ratio}
    drop_rate: ${models.model.hier_vit.drop_rate}
    attn_drop_rate: ${models.model.hier_vit.attn_drop_rate}
    drop_path_rate: ${models.model.hier_vit.drop_path_rate}
    complex_activation: ${models.model.hier_vit.complex_activation}
    abs_pos_embed: ${models.model.hier_vit.abs_pos_embed}
    mim_mask_ratio: ${models.model.hier_vit.mim_mask_ratio}
    theta_y: ${models.model.hier_vit.theta_y}
    theta_x: ${models.model.hier_vit.theta_x}

  # ── decoder ─────────────────────────────────────────────────────────────────
  decoder:
    _target_: c_vae.hier_vit.decoder.HierViTDecoder
    is_complex: true
    channels: ${models.model.latent_channels}
    in_channels: 2
    embed_dim: ${models.model.hier_vit.embed_dim}
    depths: [2, 6, 2, 2]             # reversed encoder depths
    num_heads: [32, 16, 8, 4]        # reversed encoder heads
    patch_size: ${models.model.hier_vit.patch_size}
    mlp_ratio: ${models.model.hier_vit.mlp_ratio}
    drop_rate: ${models.model.hier_vit.drop_rate}
    attn_drop_rate: ${models.model.hier_vit.attn_drop_rate}
    drop_path_rate: ${models.model.hier_vit.drop_path_rate}
    complex_activation: ${models.model.hier_vit.complex_activation}
    theta_y: ${models.model.hier_vit.theta_y}
    theta_x: ${models.model.hier_vit.theta_x}
