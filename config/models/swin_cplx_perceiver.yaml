# Model configuration — Swin V2 Complex VAE with Perceiver Compression Stage
#
# Baseline: 4-stage, patch_size [4,1]. 
# Swin outputs 512 tokens (32x16 grid) which are compressed to 128 abstract tokens
# via Perceiver Hermitian Cross-Attention to keep channels at 1024 without exploding
# to 4096 (which would happen with a standard PatchMerging).
#
# Required data overrides (CLI or experiment YAML):
#   data.train_dataset.cac=false   data.eval_dataset.cac=false
#   data.demo.istft_params.cac=false   data.model_channels=2

model:
  # ── latent space ────────────────────────────────────────────────────────────
  latent_channels: 8            # ×64 complex: C_lat × N × 2 = 8 × 128 × 2 = 2048 scalars
  parameters_to_predict: 3      # ComplexVAEBottleneck improper: mu + sigma + c

  # ── autoencoder wrapper ──────────────────────────────────────────────────────
  autoencoder:
    return_latent: false
    pre_transform:
      type: power_norm
      apply_target: true
      apply_inverse: true
      config:
        eps: 1.0e-8
        alpha: 0.65
        beta: 0.35

  # ── bottleneck ───────────────────────────────────────────────────────────────
  bottleneck:
    _target_: c_vae.bottleneck.ComplexVAEBottleneck
    apply_cholesky_constraints: false
    apply_spectral_parameterization: false
    proper: false

  # ── shared Swin hyperparameters ─────────────────────────────────────────────
  swin:
    embed_dim: 64               # head_dim=16 at all stages with num_heads=[4,8,16,32]
    window_size: [32, 16]
    patch_size: [4, 1]
    mlp_ratio: 4.0
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.1
    use_checkpoint: false
    complex_activation: ComplexGELU1d
    abs_pos_embed: false
    mim_mask_ratio: 0.0

  # ── encoder ─────────────────────────────────────────────────────────────────
  encoder:
    _target_: c_vae.swin.encoder.SwinEncoder
    in_channels: 2                    # stereo complex STFT (complex_L, complex_R)
    is_complex: true
    embed_dim: ${models.model.swin.embed_dim}
    depths: [2, 2, 6, 2]
    num_heads: [4, 8, 16, 32]
    window_size: ${models.model.swin.window_size}
    patch_size: ${models.model.swin.patch_size}
    dimension: ${mul:${models.model.parameters_to_predict},${models.model.latent_channels}}
    mlp_ratio: ${models.model.swin.mlp_ratio}
    drop_rate: ${models.model.swin.drop_rate}
    attn_drop_rate: ${models.model.swin.attn_drop_rate}
    drop_path_rate: ${models.model.swin.drop_path_rate}
    use_checkpoint: ${models.model.swin.use_checkpoint}
    complex_activation: ${models.model.swin.complex_activation}
    abs_pos_embed: ${models.model.swin.abs_pos_embed}
    mim_mask_ratio: ${models.model.swin.mim_mask_ratio}
    fused_window_process: true
    time_frames: 128
    use_smooth_convs: false
    use_perceiver_compression: true
    num_perceiver_queries: 128

  # ── decoder ─────────────────────────────────────────────────────────────────
  decoder:
    _target_: c_vae.swin.decoder.SwinDecoder
    is_complex: true
    channels: ${models.model.latent_channels}
    in_channels: 2
    embed_dim: ${models.model.swin.embed_dim}
    depths: [2, 6, 2, 2]             # reversed encoder depths
    num_heads: [32, 16, 8, 4]        # reversed encoder heads
    window_size: ${models.model.swin.window_size}
    patch_size: ${models.model.swin.patch_size}
    mlp_ratio: ${models.model.swin.mlp_ratio}
    drop_rate: ${models.model.swin.drop_rate}
    attn_drop_rate: ${models.model.swin.attn_drop_rate}
    drop_path_rate: ${models.model.swin.drop_path_rate}
    use_checkpoint: ${models.model.swin.use_checkpoint}
    time_frames: 128
    use_smooth_convs: false
    use_perceiver_compression: true

# Automatic data configuration overrides
data:
  train_dataset:
    cac: false
  eval_dataset:
    cac: false
  demo:
    istft_params:
      cac: false
  model_channels: 2
