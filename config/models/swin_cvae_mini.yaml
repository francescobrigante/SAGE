# Model configuration — Exp 1: Swin V2 Complex VAE (×64 compression target)
# Complex-valued VAE on complex64 spectrograms (cac=false, stereo).
#
# Compression check (1.5s stereo 44.1kHz):
#   5 stages, 4× PatchMerging, patch_size=4 → downsampling = 4 × 2^4 = 64×
#   grid at bottleneck: 16×2 → N=32 tokens
#   latent scalars: 32ch × 32tok × 2 (complex) = 2048 → 132300/2048 ≈ ×64 ✓
#
# Required data overrides (CLI or data.yaml):
#   data.train_dataset.cac=false   data.eval_dataset.cac=false
#   data.demo.istft_params.cac=false   data.model_channels=2

model:
  latent_channels: 32
  parameters_to_predict: 3           # improper: μ + σ + c

  autoencoder:
    return_latent: false
    pre_transform:
      type: power_norm
      apply_target: true
      apply_inverse: true
      config:
        eps: 1.0e-8
        alpha: 0.65
        beta: 0.35

  bottleneck:
    _target_: c_vae.bottleneck.ComplexVAEBottleneck
    apply_cholesky_constraints: false
    apply_spectral_parameterization: false
    proper: false

  swin:
    embed_dim: 48
    window_size: 8
    patch_size: 4
    mlp_ratio: 4.0
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.1
    use_checkpoint: false

  encoder:
    _target_: c_vae.swin.encoder.SwinEncoder
    in_channels: 2
    is_complex: true
    embed_dim: ${models.model.swin.embed_dim}
    depths: [2, 2, 2, 4, 2]
    num_heads: [3, 6, 12, 24, 24]
    window_size: ${models.model.swin.window_size}
    patch_size: ${models.model.swin.patch_size}
    dimension: ${mul:${models.model.parameters_to_predict},${models.model.latent_channels}}
    mlp_ratio: ${models.model.swin.mlp_ratio}
    drop_rate: ${models.model.swin.drop_rate}
    attn_drop_rate: ${models.model.swin.attn_drop_rate}
    drop_path_rate: ${models.model.swin.drop_path_rate}
    use_checkpoint: ${models.model.swin.use_checkpoint}
    fused_window_process: false

  decoder:
    _target_: c_vae.swin.decoder.SwinDecoder
    is_complex: true
    channels: ${models.model.latent_channels}
    in_channels: 2
    embed_dim: ${models.model.swin.embed_dim}
    depths: [2, 4, 2, 2, 2]
    num_heads: [24, 24, 12, 6, 3]
    window_size: ${models.model.swin.window_size}
    patch_size: ${models.model.swin.patch_size}
    mlp_ratio: ${models.model.swin.mlp_ratio}
    drop_rate: ${models.model.swin.drop_rate}
    attn_drop_rate: ${models.model.swin.attn_drop_rate}
    drop_path_rate: ${models.model.swin.drop_path_rate}
    use_checkpoint: ${models.model.swin.use_checkpoint}
