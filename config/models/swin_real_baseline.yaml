# @package _global_
#
# Model configuration — Swin V2 Real VAE Baseline (3-stage, depths=[2,6,2], embed_dim=256)
# Real-valued equivalent of the champion complex baseline (swin_cplx_baseline.yaml).
#
# Geometry:
#   - Input: (B, 4, 1024, 128) stereo CAC STFT (real_L, imag_L, real_R, imag_R)
#   - PatchEmbed (PS=[64,1]): grid (16, 128)
#   - Stage 0 (depth=2, heads=8): grid (16, 128), window [4,32]
#   - PatchMerge -> grid (8, 64)
#   - Stage 1 (depth=6, heads=16): grid (8, 64), window [4,32]
#   - PatchMerge -> grid (4, 32)
#   - Stage 2 (depth=2, heads=32): grid (4, 32), window [4,32] (fully global!)
#   - Latent sequence: 128 tokens, 16 channels (2048 scalars) -> x64 real compression
#

models:
  model:
    # ── latent space ────────────────────────────────────────────────────────────
    latent_channels: 16           # ×64 real: C_lat × N = 16 × 128 = 2048 scalars
    parameters_to_predict: 2      # VAEBottleneck: mu + log_var

    # ── autoencoder wrapper ──────────────────────────────────────────────────────
    autoencoder:
      return_latent: false
      pre_transform:
        type: power_norm
        apply_target: true
        apply_inverse: true
        config:
          eps: 1.0e-8
          alpha: 0.65
          beta: 0.35

    # ── bottleneck ───────────────────────────────────────────────────────────────
    bottleneck:
      _target_: ar_spectra.models.bottlenecks.VAEBottleneck
      parameters_to_predict: ${models.model.parameters_to_predict}

    # ── shared Swin hyperparameters ─────────────────────────────────────────────
    swin:
      embed_dim: 256
      window_size: [4, 32]
      patch_size: [64, 1]
      mlp_ratio: 4.0
      drop_rate: 0.0
      attn_drop_rate: 0.0
      drop_path_rate: 0.1
      use_checkpoint: false

    # ── encoder ─────────────────────────────────────────────────────────────────
    encoder:
      _target_: c_vae.swin.encoder.SwinEncoder
      in_channels: 4                    # stereo CAC real STFT (real_L, imag_L, real_R, imag_R)
      is_complex: false
      embed_dim: ${models.model.swin.embed_dim}
      depths: [2, 6, 2]                 # champion depths
      num_heads: [8, 16, 32]            # head_dim=32 constant
      window_size: ${models.model.swin.window_size}
      patch_size: ${models.model.swin.patch_size}
      dimension: ${mul:${models.model.parameters_to_predict},${models.model.latent_channels}}
      mlp_ratio: ${models.model.swin.mlp_ratio}
      drop_rate: ${models.model.swin.drop_rate}
      attn_drop_rate: ${models.model.swin.attn_drop_rate}
      drop_path_rate: ${models.model.swin.drop_path_rate}
      use_checkpoint: ${models.model.swin.use_checkpoint}
      fused_window_process: true
      time_frames: 128
      use_smooth_convs: false

    # ── decoder ─────────────────────────────────────────────────────────────────
    decoder:
      _target_: c_vae.swin.decoder.SwinDecoder
      is_complex: false
      channels: ${models.model.latent_channels}
      in_channels: 4
      embed_dim: ${models.model.swin.embed_dim}
      depths: [2, 6, 2]                 # reversed encoder depths
      num_heads: [32, 16, 8]            # reversed encoder heads
      window_size: ${models.model.swin.window_size}
      patch_size: ${models.model.swin.patch_size}
      mlp_ratio: ${models.model.swin.mlp_ratio}
      drop_rate: ${models.model.swin.drop_rate}
      attn_drop_rate: ${models.model.swin.attn_drop_rate}
      drop_path_rate: ${models.model.swin.drop_path_rate}
      use_checkpoint: ${models.model.swin.use_checkpoint}
      time_frames: 128
      use_smooth_convs: false

# Automatic data configuration overrides for real models to bypass command line boilerplate
data:
  train_dataset:
    cac: true
  eval_dataset:
    cac: true
  demo:
    istft_params:
      cac: true
  model_channels: 4
