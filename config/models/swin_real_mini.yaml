# Model configuration — Exp 0: Swin V2 Real Mini (real-valued baseline)
# Hydra instantiate API; loaded as cfg.models.model in train.py.
#
# Single source of truth:
#   latent_channels         → decoder input channels
#   parameters_to_predict   → encoder output multiplier (= 2 for real VAEBottleneck)
#   encoder.dimension       = parameters_to_predict × latent_channels (via mul resolver)

model:
  # ── single source of truth ─────────────────────────────────────────────
  latent_channels: 64          # latent space depth  →  (B, 64, 32, 4)
  parameters_to_predict: 2     # real VAEBottleneck: mu + log_var
  # ───────────────────────────────────────────────────────────────────────

  autoencoder:
    return_latent: false
    pre_transform:
      type: power_norm
      apply_target: true
      apply_inverse: true
      config:
        eps: 1.0e-8
        alpha: 0.65
        beta: 0.35

  encoder:
    _target_: c_vae.swin.encoder.SwinEncoder
    in_channels: 4                    # stereo CAC float STFT (cac=true: real_L, imag_L, real_R, imag_R)
    embed_dim: 48                     # base token width (doubles per PatchMerging)
    depths: [2, 2, 4, 2]              # SwinBlocks per stage
    num_heads: [3, 6, 12, 24]         # attention heads per stage
    window_size: 8                    # divides all stage grids cleanly
    patch_size: 4                     # Conv2d kernel/stride for PatchEmbed
    dimension: ${mul:${models.model.parameters_to_predict},${models.model.latent_channels}}
    mlp_ratio: 4.0
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.1
    use_checkpoint: false
    fused_window_process: true        # whether to use cuda kernels 

  decoder:
    _target_: c_vae.swin.decoder.SwinDecoder
    channels: ${models.model.latent_channels}   # latent input depth
    in_channels: 4                              # reconstruction output channels (CAC: real_L, imag_L, real_R, imag_R)
    embed_dim: 48                               # smallest stage width (last stage + PatchUnembed)
    depths: [2, 4, 2, 2]                        # reversed encoder depths
    num_heads: [24, 12, 6, 3]                   # reversed encoder heads
    window_size: 8
    patch_size: 4
    mlp_ratio: 4.0
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.1
    use_checkpoint: false

  bottleneck:
    _target_: ar_spectra.models.bottlenecks.VAEBottleneck
    parameters_to_predict: ${models.model.parameters_to_predict}
