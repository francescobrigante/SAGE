# Trainer + optimization + logging + losses + seed/device
seed: ${config:DEFAULT_SEED}
device: ${config:DEFAULT_DEVICE}

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3
  weight_decay: 1e-4
  betas: [0.9, 0.98]
  weight_decay_exclude_1d: true  # exclude bias + LayerNorm from weight decay

# disc_optimizer: separate AdamW for discriminator (overrides `optimizer` fields for disc only).
# If omitted, disc uses the same spec as the generator.
# SAO uses: lr=3e-4, betas=[0.8,0.99], weight_decay=1e-3  (disc_lr = 2× gen_lr in SAO).
# disc_optimizer:
#   _target_: torch.optim.AdamW
#   lr: 3e-4
#   betas: [0.8, 0.99]
#   weight_decay: 1e-3

# aux_scheduler: scheduler for opt_aux. If omitted, falls back to the global
# `scheduler:` above (same as disc). Override per-experiment if aux modules need
# a different schedule (e.g. MERT projector with cosine-decay vs DiT with InverseLR).
# aux_scheduler:
#   _target_: ar_spectra.training.schedulers.InverseLR
#   inv_gamma: 200000
#   power: 0.5
#   warmup: 0.999
#   interval: step

scheduler:
  _target_: ar_spectra.training.schedulers.InverseLR
  inv_gamma: 200000       # SAO params: LR ~93% at 32k steps, ~70% at 200k steps
  power: 0.5
  warmup: 0.999           # exponential warmup, 90% peak reached at ~2400 steps
  interval: step          # Lightning calls scheduler.step() every batch
  # --- CosineLRWithWarmup (step-based, matches Swin Transformer paper) ---
  # _target_: ar_spectra.training.schedulers.CosineLRWithWarmup
  # total_steps: 32000      # epochs * steps_per_epoch (80 * 400 for FMA-small batch=16)
  # warmup_steps: 1600      # ~5% of total_steps (~4 epochs)
  # min_lr: 1.0e-6
  # warmup_lr_init: 1.0e-7

trainer:
  precision: 32-true
  epochs: 200
  amp: false
  log_interval: 1
  deterministic: false
  strict_deterministic: false
  ckpt_dir: checkpoints/FMA_autoencoder_KL
  profile: false
  save_every_n_epochs: 10
  num_sanity_val_steps: 1
  log_model_structure: false      # if true, on train it prints entire model structure
  warmup_steps: 0
  warmup_mode: adv
  encoder_freeze_on_warmup: false   # freeze encoder only AFTER warmup_steps
  freeze_encoder: false             # freeze encoder ALWAYS (decoder-finetune mode)
  profiler_dir: lightning_profiler
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  accumulate_grad_batches: 1
  strategy: auto
  num_gpus: 1
  clip_grad_norm: 20.0
  kl_annealing_epochs: 0
  terminate_on_nan: true
  detect_anomaly: false
  # gradient_clip_val/algorithm rimossi: non supportati con manual optimization
  # Il gradient clipping viene gestito manualmente in engine.py se necessario

wandb:
  project: ${config:DEFAULT_WANDB_PROJECT}
  name: FMA_autoencoder_KL
  use_wandb: true
  log_model: false          # disabled: checkpoints are already saved in runs/checkpoints/ via ModelCheckpoint

eval_loss_config:
  sisdr:
    zero_mean: true
    reduction: mean
  stft:
    sample_rate: 44100
    fft_size: 2048
    hop_size: 512
    win_length: 2048
  mel:
    fft_size: 2048
    hop_size: 512
    win_length: 2048
    n_mels: 128

loss_config:
  spectral:
    apply_pre_transform_to_wave_losses: false
    stft_mse:
      config:
        reduction: mean
    mrstft:
      config:
        fft_sizes:  [2048, 1024, 512, 256, 128, 64]   # 6 risoluzioni SAO (32 omesso: instabile)
        hop_sizes:  [512,  256,  128, 64,  32,  16]   # fft/4 — coerente con SAO
        max_loss_clamp: 20.0      # bounds explosive spikes from near-zero bins
        log_mag: true             # log-magnitude L1 on each resolution
        factor_log_mag: 1.0
    cosine_phase_loss:
      config:
        energy_weighted: true
        energy_power: 1.0
        eps: 1.0e-7
        reduction: mean
    stft_consistency:
      config:
        n_fft: 2048
        hop_length: 512
        win_length: 2048
        center: true
        normalized: false
        reduction: mean
    weights:
      stft_mse: 1.0
      mrstft: 0.0         # disabled by default; run07+ override a 1.0 via CLI
      cosine_phase_loss: 0.0
      stft_consistency: 0.0
  mrmel:
    weights:
      mrmel: 0.3
    config:
      n_mels: [128, 128, 128]
      # n_mels: [128, 64, 32]
      window_lengths: [2048, 1024, 512]
      pow: 2.0            # exponent for power spectrogram (1.0 = mag, 2.0 = power)
      log_weight: 1.0
      mag_weight: 1.0
  # SAME-MRSTFT reconstruction loss (LATENT_ALIGNMENT_PLAN.md Fase 5): per-resolution
  # spectral-contrast (bounded) + adaptive σ-normalized log-mag + IF/GD on normalized
  # phasors, K-weighted, over L/R + mid/side. Default weight 0.0 → inert (existing runs
  # unchanged); set mrstft_same=1.0 via CLI to enable (see S1_real_same_mrstft.slurm).
  mrstft_same:
    weights:
      mrstft_same: 0.0
    config:
      fft_sizes: [32, 64, 128, 256, 512, 1024, 2048]   # 7 SAME resolutions
      overlap: 0.75        # hop = n_fft * (1 - overlap)
      k_weighting: true    # perceptual K-weight on magnitudes
      w_sc: 1.0            # spectral-contrast term
      w_lm: 1.0            # adaptive log-mag term
      w_ifgd: 1.0          # instantaneous-freq / group-delay term
      ms_lr: true          # process mid/side in addition to L/R
  # SAO-exact stereo reconstruction loss (STEREO_COLLAPSE fix): sum/difference
  # + left/right MR-STFT (SC + log-mag L1, A-weighted), replicating SAO's
  # reversed-order AuralossLoss chain → SC normalizes by the RECONSTRUCTION:
  # quasi-mono targets are bounded (no clamp needed), a collapsed Side is
  # penalized hard (anti-shrinkage). Default weight 0.0 → inert; enable via
  # CLI (see next_slurms/LARGE2_ms_{replace,add}.slurm). Stereo-aware disc:
  # ++trainer.loss_config.discriminator.config.fold_lrms=true (default false,
  # defined in WavTokenizerDiscriminator — no discriminator block here).
  mrstft_sd:
    weights:
      mrstft_sd: 0.0
    config:
      fft_sizes:   [2048, 1024, 512, 256, 128, 64]   # 6 SAO resolutions (32 omitted: unstable)
      hop_sizes:   [512,  256,  128, 64,  32,  16]    # fft/4 — SAO convention
      win_lengths: [2048, 1024, 512, 256, 128, 64]
      perceptual_weighting: true    # A-weighting FIR pre-filter (SAO default)
      w_ms: 1.0                     # mid/side branch weight (SAO: 1.0)
      w_lr: 1.0                     # left/right branch weight (SAO: 1.0 → 0.5 per channel)
      # ── L1/L2/L5 (STEREO_COLLAPSE_DIAGNOSIS §11.4) — default = SAO invariato ──
      # L1: pesi separati per Mid e Side. null → w_ms/2 ciascuno (comportamento SAO).
      # Solo-Side = w_lr:0, w_mid:0, w_side:1 → gradiente sul Mid esattamente nullo,
      # quindi FAD/CLAP/CDPAM (che vedono solo il Mid) non possono peggiorare.
      w_mid:  null
      w_side: null
      # L2: salta il termine Side quando il TARGET ha S/M sotto questa soglia (dB).
      # null = nessun gate. -40 copre il 10,4% di finestre near-mono del corpus
      # (7,0% mono esatto), dove il termine log-mag insegnerebbe |Ŝ| → 0.
      side_gate_db: null
      # L5: floor del denominatore della spectral convergence. Con l'ordine SAO
      # invertito il denominatore È la ricostruzione, quindi va a zero proprio nel
      # caso che la loss deve punire. Vincola solo sotto un collasso di ~60 dB.
      sc_eps_rel: 1.0e-3
      sc_eps_abs: 1.0e-12
  # ── A — ComplexMSE solo-Side normalizzata (STEREO_COLLAPSE_DIAGNOSIS §11.4) ──
  # ‖Ŝ−S‖²/(‖S‖²+ε) sullo stesso spettrogramma CAC power-norm di stft_mse.
  # La ComplexMSE contiene GIÀ la fase del Side (identità del parallelogramma,
  # rapporto misurato 1.00000012) ma il Side è il 6,0% dell'energia → ~6% del
  # gradiente. Normalizzando per ‖S‖² il termine diventa scale-free e i passaggi
  # con poco Side non sono più annegati. Mid-ortogonale come L1 e L6.
  mse_side:
    weights:
      mse_side: 0.0               # off di default
    config:
      normalize: true             # true → nessun λ da tarare
      side_gate_db: null          # come L2

  # ── L6 — coerenza inter-canale (STEREO_COLLAPSE_DIAGNOSIS §11.4) ──────────
  # Surrogato differenziabile di d_pan: penalizza γ = 2·M·S*/(|M|²+|S|²), la
  # cross-correlazione normalizzata M/S. Re(γ) È esattamente il pan (err 3.6e-07).
  # Serve perché mrstft_sd è solo-magnitudine: ruotando arg(S) di 90° a magnitudine
  # fissa, d_width si muove di 4.8e-09 e d_pan di 0.715 — la loss di magnitudine
  # rimette l'energia del Side con qualunque fase, ed è per questo che tutti gli
  # arm M/S hanno corretto il livello lasciando d_pan inchiodato al null mono.
  stereo_coh:
    weights:
      stereo_coh: 0.0             # off di default
    config:
      fft_sizes:   [2048, 1024, 512]   # solo risoluzioni grandi: a n_fft=64 la
      hop_sizes:   [512,  256,  128]   # coerenza non ha risoluzione in frequenza
      win_lengths: [2048, 1024, 512]
      detach_mid: true            # ∂L/∂Mid esattamente 0 → FAD/CLAP non toccabili
      side_gate_db: null          # come L2: -40 salta gli item senza Side
      # ⚠️ γ è invariante a uno scaling COMUNE di M e S → L6 non corregge il
      # LIVELLO del Side, solo la sua direzione. Va sempre accoppiata a un
      # termine di livello (mrstft_sd solo-Side, o la ComplexMSE sul Side).

  bottleneck:
    weights:
      kl: 1.0e-3          # annealed from 0 to kl_beta_target over kl_annealing_epochs
