# @package _global_
# =============================================================================
# Stereo-discriminator proxy, arm A3 = A1 + every critic joint with M, S given to all:
# MPD on [L, R, M, S]; magnitude MRD on [|L|, |R|, |M|, |S|]; DAC complex MRD on Re/Im of [L, R, M, S].
# fold_lrms has no effect here (no branch folds). Differs from C0 only in the keys below.
# =============================================================================
defaults:
  - stereo_proxy
  - _self_

trainer:
  wandb:
    name: stereo_proxy_a3
  loss_config:
    discriminator:
      config:
        preprocess_gain: shared
        mpd_stereo: lrms
        mrd_stereo: lrms
        dac_stereo: lrms
        fused_bias_act: false         # joint critics: the Triton kernel is -2.1 % it/s here (CPU-bound forward)
        fused_bias_grad: false
