# @package _global_
# =============================================================================
# Stereo-discriminator proxy, arm A3+FM = A3's discriminator with the feature-matching weight 0.2 -> 1.0.
# With joint critics L_fm is the only paired adversarial term: it matches the critic's features of the
# reconstruction to those of its own reference, and in A3 those features mix |L| and |R|, i.e. they carry
# the pan that the unconditional adversarial term cannot ask for (Stable Audio Open's VAE uses 5.0).
# =============================================================================
defaults:
  - stereo_proxy_a3
  - _self_

trainer:
  wandb:
    name: stereo_proxy_a3_fm
  loss_config:
    discriminator:
      weights:
        feature_matching: 1.0
