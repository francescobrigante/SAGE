# @package _global_
# =============================================================================
# Stereo-discriminator proxy, arm A4 = A1 + scales for 44.1 kHz (critics still folded).
# The WavTokenizer scales were set in samples for 24 kHz speech: at 44.1 kHz the lowest DAC band
# is 0-2.2 kHz and no critic resolves the harmonics of a bass. Here: Vocos magnitude MRD about x2,
# DAC windows 4096/2048/1024 (512 is dropped: 2 bins below 250 Hz) and musical DAC bands
# 0-250 Hz, 250 Hz-1 kHz, 1-4 kHz, 4-10 kHz, 10-22.05 kHz. MPD periods unchanged.
# VALUES TO BE APPROVED by the user (PLAN_WAVTOKENIZER_STEREO M2 gate).
# =============================================================================
defaults:
  - stereo_proxy
  - _self_

trainer:
  wandb:
    name: stereo_proxy_a4
  loss_config:
    discriminator:
      config:
        preprocess_gain: shared
        resolutions: [[2048, 512, 2048], [4096, 1024, 4096], [1024, 256, 1024]]
        fft_sizes: [4096, 2048, 1024]
        # band edges as fractions of Nyquist (22050 Hz): 0, 250, 1000, 4000, 10000, 22050 Hz
        dac_bands: [0.0, 0.011337868, 0.045351474, 0.181405896, 0.453514739, 1.0]
