# @package _global_
# =============================================================================
# Speed-ups of the generator (SAGE encoder + decoder) in training, on top of any recipe:
# compile_generator compiles the encoder and the decoder in place with torch.compile (mode default,
# static shapes; sage/training/compile.py). Same model, losses and checkpoint keys, but not bit-exact:
# inductor fuses and reorders float operations, and draws the drop-path masks from its own RNG stream.
# The first batches of a run compile one graph per input signature (generator step, discriminator step,
# validation, demos): a few minutes on a GPU, then a faster step.
# Measured: generator forward + backward 111 -> 66 ms (A100, batch 8 x 128 frames, TF32, probe); full
# training step of the proxy recipe: <pending, plan F3/G3>.
# Not in speedup/recipe.yaml until the A/B (3 seeds per arm) shows no loss of quality.
#
#   python train.py +experiment=stereo_proxy_a3_fm +speedup=generator_fast trainer.trainer.num_gpus=2
# =============================================================================
trainer:
  trainer:
    compile_generator: true           # torch.compile of encoder and decoder, in place
