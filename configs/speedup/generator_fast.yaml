# @package _global_
# =============================================================================
# Speed-ups of the generator (SAGE encoder + decoder) in training, on top of any recipe:
# - compile_generator compiles the encoder and the decoder in place with torch.compile (mode default,
#   static shapes; sage/training/compile.py). Same model, losses and checkpoint keys, but not bit-exact:
#   inductor fuses and reorders float operations, and draws the drop-path masks from its own RNG stream.
# - sdpa_train: the attention through F.scaled_dot_product_attention with autograd (enable_sdpa_train),
#   patch_linear: PatchEmbed / PatchUnembed as one GEMM (enable_patch_linear). Same formula and weights,
#   equal in exact arithmetic (float64 gradients of a block: ~1e-14), not bit-identical; complex modules unchanged.
# The first batches of a run compile one graph per input signature (generator step, discriminator step,
# validation, demos): about 4 minutes on an A100, then a faster step.
# Measured (A100): generator forward + backward 111 -> 66 ms with compile (batch 8 x 128 frames, TF32); the
# proxy recipe (stereo_proxy_a3_fm, 2 GPUs, same node, 600 batches): off 4.10 it/s, peak memory 14.6 GiB;
# compile_generator alone 4.64 it/s (+13 %), 14.1 GiB; this file 4.67 it/s (+14 %), 12.5 GiB.
# Not in speedup/recipe.yaml until the A/B (3 seeds per arm) shows no loss of quality.
#
#   python train.py +experiment=stereo_proxy_a3_fm +speedup=generator_fast trainer.trainer.num_gpus=2
# =============================================================================
trainer:
  trainer:
    compile_generator: true           # torch.compile of encoder and decoder, in place
    sdpa_train: true                  # attention through SDPA, with autograd
    patch_linear: true                # patch layers as one GEMM
