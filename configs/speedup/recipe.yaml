# @package _global_
# =============================================================================
# The speed-ups the recipes turn on (pretrain, decoder_ft, and through pretrain the stereo_proxy arms):
# critic_fast_fused + loop_fast + generator_fast, key for key (tests/test_disc_speed.py checks it). Written
# out instead of including those files: a file merged twice in one composition does not apply its new
# subtrees again (Hydra 1.3), so "+speedup=[legacy,critic_fast_fused]" on a recipe would silently stay legacy.
# The recipes with joint (stereo) critics turn the fused keys off again: pretrain, decoder_ft,
# stereo_proxy_a3 and its variants; the fold-critic proxy arms (stereo_proxy C0, A1) keep them.
# =============================================================================
trainer:
  trainer:
    freeze_disc_in_gen_step: true
    disc_step_loss_only: true
    ema_foreach: true
    log_every_n_batches: 1
    progress_bar_refresh_rate: 50
    lr_monitor: false
    detach_step_output: true
    ddp_skip_idle_buckets: true
    ddp_gradient_as_bucket_view: true
    ddp_broadcast_buffers: false
    compile_generator: true
    sdpa_train: true
    patch_linear: true
  loss_config:
    discriminator:
      config:
        inplace_act: true
        fused_feature_matching: true
        channels_last: true
        branch_streams: true
        fused_bias_act: true
        fused_bias_grad: true
