[project]
name = "sage"
version = "0.1.0"
description = "SAGE: Semantic Audio Generative Encoder — a Swin V2 variational autoencoder for stereo music"
authors = [
    { name = "Francesco Brigante", email = "francescobrigantefb@gmail.com" },
]
license = { text = "TBD" }
readme = "README.md"
# Python 3.11 is the only version SAGE has been trained and tested with.
requires-python = ">=3.11,<3.12"

# Core = what inference needs: rebuild the model from a checkpoint, encode, decode.
dependencies = [
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "numpy>=1.26",
    "einops>=0.8.1",
    "timm>=1.0.0",
    "hydra-core>=1.3.2,<1.4",
    "omegaconf>=2.3.0,<2.4",
    "rich>=14.0",
    "pyyaml>=6.0",
    "soundfile>=0.13.1",             # audio I/O of scripts/encode_decode.py
]

[project.optional-dependencies]
# Training: both phases (pretraining with the CLAP teacher, decoder fine-tuning).
train = [
    "lightning==2.6.0",
    "wandb>=0.23.0",
    "descript-audio-codec>=1.0.0",   # `dac` + `audiotools`: DAC sub-discriminators, mel loss
    "laion-clap==1.1.7",             # frozen CLAP teacher (semantic distillation)
    "scipy>=1.12",
    "librosa>=0.10.2",
    "mutagen>=1.47.0",               # fast audio-duration probing in the data pipeline
    "safetensors>=0.6.2",
    "tqdm>=4.66",
    # W&B demo logging during training (sage/utils/aeiou.py: spectrogram images, latent UMAP)
    "matplotlib>=3.8",
    "pillow>=10.0",
    "plotly>=5.0",
    "umap-learn>=0.5.5",
    # Alternative discriminators (the paper uses WavTokenizer): wavelet pretransform (transformer/HIL)
    # and CQT front-end (subband).
    "pywavelets>=1.4",
    "nnaudio>=0.3.3",
]
# Evaluation of SAGE: reconstruction metrics (FAD, CLAP, CDPAM, SI-SDR/STFT) and MAEB probing.
# Metric-stack versions are the ones used for the paper's tables.
eval = [
    "sage[train]",
    "fadtk==1.1.0",
    "transformers==4.38.0",          # MERT embeddings used by fadtk (FAD-MERT)
    "frechet-audio-distance==0.1.2", # PANN Cnn14 backbone (FAD-PANN)
    "cdpam==0.0.6",
    "resampy==0.4.3",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "mteb>=2.0",
    "datasets>=3.0",
    # evaluation.tables prints plain markdown: no plotting dependency
]
# Baselines: the released SOTA autoencoders of Tables 2 and 4 (Music2Latent, CoDiCodec,
# Stable Audio Open VAE, SAME). Weights are downloaded by each package on first use.
baselines = [
    "sage[eval]",
    "music2latent==0.1.8",
    "codicodec==0.1.2",
    "diffusers==0.30.0",             # AutoencoderOobleck = Stable Audio Open VAE
    "stable-audio-3",                # SAME-L / SAME-S autoencoders (git, see tool.uv below)
]

# Complex-valued building blocks (sage.nn.complex), only for models built with is_complex=True.
# The real-valued SAGE of the paper does not need them.
complex = [
    "complextorch==1.2.0",           # numpy requirement overridden below (see tool.uv.dependency-metadata)
    "complexpytorch>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# Never resolve pre-releases: every locked version must be a stable release.
prerelease = "disallow"

# stable-audio-3 is not on PyPI. Its declared requirements pull in the text-to-audio stack
# (transformers 5, flash-attn, ...), which the autoencoder path never imports and which conflicts
# with the metric stack. We declare only what the autoencoder path imports — the transparent
# equivalent of `pip install --no-deps` used for the paper's evaluation.
[[tool.uv.dependency-metadata]]
name = "stable-audio-3"
version = "0.1.0"
requires-dist = ["einops", "einops-exts", "safetensors", "torchaudio", "packaging"]

# complextorch 1.2.0 (complex-valued blocks, is_complex=True) declares
# numpy>=2.2, which conflicts with fadtk==1.1.0 (numpy<2) of the paper's metric stack. SAGE is
# real-valued and never calls complextorch; the paper environment ran numpy 1.26.4. We keep its
# other requirements and relax only numpy.
[[tool.uv.dependency-metadata]]
name = "complextorch"
version = "1.2.0"
requires-dist = ["numpy>=1.26", "setuptools>=68.2.2", "torch>=1.11.0", "deprecated>=1.2.18"]  # upstream: numpy>=2.2.0

[tool.uv.sources]
stable-audio-3 = { git = "https://github.com/Stability-AI/stable-audio-3", rev = "bccf5b7b" }
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

# Linux: CUDA 12.6 wheels. macOS: the default PyPI wheels (CPU / MPS).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Current layout; becomes a single `src/sage` package in phase F2.
packages = ["src/sage"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root (train.py, the evaluation package) and src/ are importable from every test.
pythonpath = [".", "src"]
markers = [
    "slow: tests that run the full 1024x128 encoder/decoder (deselect with '-m not slow')",
    "smoke: fast end-to-end checks of inference, training, fine-tuning and evaluation",
    "weights: needs real pretrained weights or datasets (CLAP, MERT, PANN, SOTA models); opt-in with '-m weights'",
]
addopts = "-m 'not weights'"
