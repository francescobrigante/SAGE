[project]
name = "C-VAE"
version = "0.1.0"
description = "end-to-end C-VAE for Audio generation"
authors = [
    { name = "Francesco Brigante", email = "francescobrigantefb@gmail.com" }
]
license = { text = "TBD" }
requires-python = ">=3.10"
dependencies = [
    "descript-audio-codec>=1.0.0",
    "einops>=0.8.1",
    "encodec>=0.1.1",
    "lightning==2.6.0",
    "hydra-core>=1.3.2",
    "plotly>=6.4.0",
    "rich>=14.2.0",
    "safetensors>=0.6.2",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "tqdm>=4.66.5",
    "typeguard>=4.4.4",
    "wandb>=0.23.0",
    "pandas>=2.3.3",
    "lion-pytorch>=0.2.3",
    "pytest>=9.0.1",
    "resampy>=0.4.3",
    "frechet-audio-distance>=0.1.2",
    "complextorch>=1.2.0",
    "complexpytorch>=0.4",
    "deepspeed>=0.18.2; sys_platform == 'linux'",
    "mutagen>=1.47.0",
    "cdpam>=0.0.6",
    "diffusers>=0.36.0",
    "nvitop>=1.6.2; sys_platform == 'linux'",
    "huggingface-hub<1.0",
    "timm>=1.0.0",
    "umap-learn>=0.5.5",
    "matplotlib>=3.8.0",
    "python-dotenv>=1.0.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }
]
torchaudio = [
  { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
    "pillow>=12.0.0",
    "plotly>=6.5.0",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
markers = [
    "slow: tests that run the full 1024x128 encoder/decoder (deselect with '-m not slow')",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ar_spectra", "src/c_vae"]
